<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK Lab</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #5f6368;
      --line: #d9dadd;
      --paper: #fffdf7;
      --accent: #0b6f5c;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.75;
    }

    main {
      max-width: 840px;
      margin: 0 auto;
      padding: 56px 24px 72px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.2;
      margin: 0 0 12px;
    }

    h2 {
      border-top: 1px solid var(--line);
      font-size: 1.25rem;
      margin: 36px 0 12px;
      padding-top: 24px;
    }

    p,
    li {
      font-size: 1rem;
    }

    a {
      color: var(--accent);
      font-weight: 600;
    }

    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    ul {
      padding-left: 1.4rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>UK Lab</h1>
    <p class="lead">個人開発アプリの公開情報、サポート、プライバシーポリシーを掲載します。</p>

    <h2>タクシー営業ノート</h2>
    <ul>
      <li><a href="./taxinote/privacy-policy/">プライバシーポリシー</a></li>
      <li><a href="./taxinote/support/">サポート</a></li>
    </ul>
  </main>
</body>
</html>
